# Scholz-Seshadri-Khitatrakun (2006, JPE) equivalence-scale weighting applied
package_root: tmp/paper_baseline_sep14/code/model
# multiplicatively (flow utility = e(m)*U(X/e(m)), exponent sigma) instead of
# the production "deflate" convention (flow utility = U(X/e(m)), exponent
# sigma-1). See sandbox/mechanisms.py for the exact formula and its scope
# (active only when eqscale_form is power or sqrt; the retained calibration
# uses eqscale_form=power via the E5 profile).
overrides:
  scale_weighting: multiply
