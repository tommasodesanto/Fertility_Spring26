# E6b PSID earnings decomposition at fixed child-preference level (psi fixed).
# Replaces the live Floden-Linde AR(1) persistent base with the E6b two-part
# decomposition, keeping the 3-level permanent structure (Nz = 15).
# Annual inputs: persistent rho 0.8863, persistent stationary log-variance
# 0.3319, fixed-effect (permanent) log-variance 0.3931. After-tax scaling
# (1 - tau) with tau = 0.181 (HSV_TAU_US, externals.py) is applied to BOTH
# components, i.e. factor 0.819 on standard deviations: persistent annual
# innovation variance = 0.3319 * (1 - 0.8863^2) = 0.071183359689, sd =
# 0.26680209835943947, after-tax sd = 0.2185109185563809 (same scaling
# precedent as FLHSV_ANNUAL_INNOVATION_SD, externals.py); permanent log
# variance = 0.3931 * 0.819^2 = 0.2636761491 (live code value
# E6B_FIXED_LOG_VARIANCE = 0.3930530, e6b_profile.py, is the unscaled source).
# Four-year conversion exactly as local_panel.py:income_process_overrides
# (PERIOD_YEARS = 4.0, calibration.py): rho_4 = 0.8863^4 = 0.617053751756736;
# sigma_eps_4 = 0.2185109185563809 * sqrt(1 + rho^2 + rho^4 + rho^6) =
# 0.3712946279068519; sigma_log = sigma_eps_4 / sqrt(1 - rho_4^2) =
# 0.4718321480145242; Rouwenhorst p = (1 + rho_4)/2 = 0.808526875878368 on 5
# states with binomial weights [1,4,6,4,1]/16 and the log grid normalized to
# mean 1. Permanent levels are the 3-node Gauss-Hermite rule at the scaled
# variance (e6b_profile.py:permanent_income_levels), combined by Kronecker
# product exactly as e6b_profile.py:e6b_overrides. Content checks on the
# embedded numbers: combined grid mean 1.0, stationary gap 2.8e-17 (package
# gate 1e-10, parameters.py), level mean 1.0. Override keys are the calibration
# layer's own dict keys (local_panel.py, externals.py, e6b_profile.py,
# e5f_income_entry_profile.py passes them through).
